[workspace]
resolver = "2"
members = [
    "crates/llave-core",
    "crates/llave-core-ffi",
    "crates/llave-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
# Shared
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-logfmt = "0.3"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "cookies", "json", "socks"] }
base64 = "0.22"
url = "2"
dirs = "6"
parking_lot = "0.12"
zeroize = { version = "1", features = ["serde"] }

# Crypto
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
sha2 = "0.10"

# FFI
flutter_rust_bridge = "=2.11.1"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Tests
tempfile = "3"

# CLI
rpassword = "7"
