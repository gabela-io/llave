name: llave
description: >
  Alternative Llave client for Spain's digital identity authentication.
  Powered by a Rust core shared across CLI, web, and mobile.

publish_to: "none"
# Same as the Cargo workspace version; the build number is the Android
# versionCode, MAJOR*10000 + MINOR*100 + PATCH (checked by the CLI tests).
version: 0.1.0+100

environment:
  sdk: ^3.6.0
  flutter: ^3.27.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_rust_bridge: 2.11.1
  freezed_annotation: ^2.4.0
  json_annotation: ^4.9.0
  riverpod: ^2.6.0
  flutter_riverpod: ^2.6.0
  go_router: ^14.0.0

  flutter_secure_storage: ^9.2.0
  mobile_scanner: ^6.0.0
  local_auth: ^2.3.0
  shared_preferences: ^2.3.0
  logging: ^1.3.0
  ffi: ^2.1.0
  smart_auth: ^3.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.0
  freezed: ^2.5.0
  json_serializable: ^6.8.0
  integration_test:
    sdk: flutter

flutter:
  generate: true
  uses-material-design: true
